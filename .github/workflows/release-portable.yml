name: Release Portable Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-portable:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run generate:icons

      - name: Build portable
        run: npm run dist:portable

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: canvas-studio-portable
          path: release/Canvas-Studio-Portable-*.exe

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/Canvas-Studio-Portable-*.exe
